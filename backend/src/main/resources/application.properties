spring.application.name=smarthire

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smarthire}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Resume PDFs are stored outside the source tree; override with RESUME_STORAGE_DIR if needed.
smarthire.resume.storage-dir=${RESUME_STORAGE_DIR:./uploads/resumes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
